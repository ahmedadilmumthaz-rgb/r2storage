# R2 Storage Platform - nginx site config
#
# Installed by deploy.sh (placeholders __DOMAIN__ -> BASE_DOMAIN) to:
#   /etc/nginx/sites-available/r2storage
#   /etc/nginx/sites-enabled/r2storage  (symlink)
# Then: nginx -t && systemctl reload nginx
#
# TLS uses your existing Cloudflare origin certificate on the VPS.
# The origin cert must cover __DOMAIN__ AND *.__DOMAIN__.
# Put it at /etc/ssl/cloudflare/__DOMAIN__.{pem,key}, or edit the paths below.
#
# NOTE: nginx always prefers a *specific* server_name over a wildcard, so
# this wildcard (*.__DOMAIN__) will not shadow other apps on this VPS.
#
# Tip: add `server_tokens off;` to the http block of your main nginx.conf
# if it isn't already there (it is not valid inside a site config).

# Upstream keepalive: reuse backend connections across requests.
upstream r2storage_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

# 1. CDN host: bucket objects at https://cdn.__DOMAIN__/<key>
#    plus subdomain-style buckets at https://<bucket>.__DOMAIN__/<key>
server {
    listen 80;
    listen [::]:80;
    server_name cdn.__DOMAIN__ *.__DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.__DOMAIN__ *.__DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__.pem;
    ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;

    # Match the backend's 10 GB streaming limit (0 = unlimited, enforced by the app)
    client_max_body_size 0;

    # Object bytes must never be re-compressed here (Cloudflare handles it)
    gzip off;

    location / {
        proxy_pass http://r2storage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";              # keepalive upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Real client IP when behind Cloudflare; rate limiting in the app keys off this
        proxy_set_header X-Forwarded-For "$http_cf_connecting_ip, $proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads/downloads directly; do not buffer multi-GB objects in nginx
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;                     # never retry an upload

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# 2. Control panel host: dashboard + admin API at https://panel.__DOMAIN__
server {
    listen 80;
    listen [::]:80;
    server_name panel.__DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.__DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__.pem;
    ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;

    client_max_body_size 0;

    # Compress the dashboard assets + JSON API responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml
               image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://r2storage_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "$http_cf_connecting_ip, $proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
