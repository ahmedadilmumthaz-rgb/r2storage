# R2 Storage Platform - MULTI-TENANT nginx site config
#
# Replaces the per-site r2storage.conf once the SaaS goes live. Instead of
# separate server blocks per host, ONE catch-all TLS server routes every request
# by Host header through a control-plane-generated map:
#
#   /etc/nginx/r2storage-map.conf   (map $host $r2_tenant_port { ... })
#
# which maps each customer's subdomains (cdn./panel./<bucket>.<domain>) to that
# tenant's container port, and the platform hosts to the control plane app.
# A default of 0 (=> 404) kills host-header spoofing for unknown hosts.
#
# Install (deploy.sh --multitenant or platform provisioning) to:
#   /etc/nginx/sites-available/r2storage-multitenant
#   /etc/nginx/sites-enabled/r2storage-multitenant
# Then: nginx -t && systemctl reload nginx
#
# TLS is a single Cloudflare origin certificate covering the PLATFORM zone
# (e.g. r2platform.com + *.r2platform.com). Per-customer edge TLS is terminated
# at Cloudflare via SSL for SaaS; the origin only ever terminates the platform
# zone's cert. See PLATFORM.md.
#
# Placeholders (replaced by deploy):
#   __DOMAIN__         platform zone, e.g. r2platform.com
#   __PLATFORM_PORT__  control plane app port (default 4000)
#
# NOTE: `server_tokens off;` is invalid inside a site config — put it in the
# http block of your main nginx.conf if it isn't already there.

# Generated by the control plane: maps each customer host to its tenant port.
include /etc/nginx/r2storage-map.conf;

# 1. All HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. Catch-all HTTPS: route by $host via the map above
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__.pem;
    ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;

    # Match the backend's 10 GB streaming limit (0 = unlimited, enforced by the app)
    client_max_body_size 0;

    # Compress dashboard/API text. Object bytes are binary content-types
    # (not in gzip_types) so they stream through uncompressed, same as before.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml
               image/svg+xml;
    gzip_min_length 1024;

    location / {
        # Unknown host -> 404 (no tenant / platform mapped to this host)
        if ($r2_tenant_port = 0) { return 404; }

        proxy_pass http://127.0.0.1:$r2_tenant_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";              # keepalive upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Real client IP when behind Cloudflare; rate limiting in the app keys off this
        proxy_set_header X-Forwarded-For "$http_cf_connecting_ip, $proxy_add_x_forwarded_for";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads/downloads directly; do not buffer multi-GB objects in nginx
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;                     # never retry an upload

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
